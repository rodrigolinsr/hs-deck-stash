server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Docker's embedded DNS lets Nginx re-resolve the backend after a restart.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Keep the browser on one HTTPS origin. Cookies and API requests therefore
    # never need a public backend URL.
    location /api/ {
        set $backend_upstream http://backend:8001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Coolify terminates TLS before this container. Preserve that original
        # scheme so FastAPI marks session cookies Secure.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # React Router routes must resolve to the SPA entry point on direct visits.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
